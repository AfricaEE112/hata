<body>
<header class="top">
  <a class="brand" href="#/"><span class="mark"><svg viewBox="0 0 10 12"><path d="M0 0v12l10-6z"/></svg></span>VidBox</a>
  <nav class="nav">
    <a href="#/" data-tab="home">Головна</a>
    <a href="#/lib" data-tab="lib">Бібліотека</a>

  </nav>
  <label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Пошук відео" autocomplete="off" enterkeyhint="search" aria-label="Пошук відео"></label>
  <button class="btn ghost rnd" data-random><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r=".6"/><circle cx="15.5" cy="8.5" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="8.5" cy="15.5" r=".6"/><circle cx="15.5" cy="15.5" r=".6"/></svg><span>Випадкове</span></button>
  <a class="btn icon ghost gear" href="#/settings" data-tab="settings" title="Налаштування" aria-label="Налаштування"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
</header>
<main id="app"><div class="empty">Завантажую бібліотеку…</div></main>
<nav class="tabs">
  <a href="#/" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/></svg>Головна</a>
  <a href="#/lib" data-tab="lib"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7.5 4v16M16.5 4v16M3 9h4.5M3 15h4.5M16.5 9H21M16.5 15H21"/></svg>Бібліотека</a>
  <a href="#/top" data-tab="top"><svg class="i" viewBox="0 0 24 24"><path d="M4 20v-6h5v6M9.5 20V7h5v13M15 20v-9h5v9M3 20.5h18"/></svg>Рейтинг</a>
  <button data-random><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="8.5" cy="8.5" r=".6"/><circle cx="15.5" cy="8.5" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="8.5" cy="15.5" r=".6"/><circle cx="15.5" cy="15.5" r=".6"/></svg>Випадкове</button>
</nav>
<div id="sheet" class="sheet" hidden><div class="scrim" data-close></div><article class="panel" role="dialog" aria-modal="true" tabindex="-1"></article></div>
<div id="picker" class="sheet" hidden><div class="scrim" data-pclose></div><article class="panel small" role="dialog" aria-modal="true" aria-label="Вибір папки"></article></div>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
